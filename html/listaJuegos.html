<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/mando.png">
    <script type="module" src="../scripts/main.js"></script>
    <script type="module" src="../scripts/DOM/listas/listaJuegos.js"></script>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/filtros.css">
    <link rel="stylesheet" href="../styles/listas.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <title>Lista de juegos</title>
</head>

<body>
    <div id="header-container"></div>

    <h1>Lista de juegos</h1>

    <form id="formulario-busqueda" class="formulario-busqueda">
        <input type="text" id="busqueda" placeholder="Buscar juego">

        <div class="filtro-valoracion">
            <label for="valoracion">Puntuación mínima</label>

            <div class="valoracion-control">
                <input type="range" min="1" max="5" step="0.01" value="5" id="valoracion" class="slider">

                <output id="valor-actual">5.00</output>
            </div>
        </div>

        <label for="ordenar">Ordenar por:</label>
        <select id="ordenar">
            <option value="nombre-asc">Nombre (A-Z)</option>
            <option value="nombre-desc">Nombre (Z-A)</option>
            <option value="puntuacion-desc">Mayor puntuación</option>
            <option value="puntuacion-asc">Menor puntuación</option>
            <option value="fecha-desc">Más recientes</option>
            <option value="fecha-asc">Más antiguos</option>
        </select>

        <button type="submit">Buscar</button>
    </form>

    <div class="listadoVG">
        <ul id="listaJuegos" class="listaTarjetas">

        </ul>
    </div>

    <div id="footer-container"></div>
</body>

</html>
